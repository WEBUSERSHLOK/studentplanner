<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#16203A; --ink-2:#3B4560; --muted:#6B7488;
  --line:#E2E6ED; --line-2:#EEF1F5; --accent:#2747C9; --accent-soft:#E8EDFC; --accent-ink:#FFFFFF;
  --hl:#FFD84D; --hl-soft:#FFF5CC; --danger:#C93A3A; --danger-soft:#FBEAEA; --warn:#B86E00; --warn-soft:#FFF1DB;
  --ok:#17845A; --ok-soft:#E3F4EC; --shadow:0 10px 30px rgba(22,32,58,.14);
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --font:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F1422; --surface:#161C2D; --surface-2:#1B2236; --ink:#E9ECF4; --ink-2:#C3C9D8; --muted:#8C94A8;
  --line:#283049; --line-2:#20273B; --accent:#7D95FF; --accent-soft:#222C4D; --accent-ink:#0F1422;
  --hl:#F2CB3B; --hl-soft:#3A3318; --danger:#FF7B7B; --danger-soft:#3A1E24; --warn:#F2B04A; --warn-soft:#3A2E17;
  --ok:#4FD39B; --ok-soft:#15352A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F1422; --surface:#161C2D; --surface-2:#1B2236; --ink:#E9ECF4; --ink-2:#C3C9D8; --muted:#8C94A8;
  --line:#283049; --line-2:#20273B; --accent:#7D95FF; --accent-soft:#222C4D; --accent-ink:#0F1422;
  --hl:#F2CB3B; --hl-soft:#3A3318; --danger:#FF7B7B; --danger-soft:#3A1E24; --warn:#F2B04A; --warn-soft:#3A2E17;
  --ok:#4FD39B; --ok-soft:#15352A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:15px;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:6px;background:var(--hl);opacity:.85;border-radius:2px}
.brand-mark span{position:relative;z-index:1}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none;opacity:.8}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .count{margin-left:auto;font-size:12px;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted)}
.main{min-width:0;padding:28px clamp(16px,3.4vw,44px) 120px}
.wrap{max-width:1240px;margin:0 auto}
.bottom-nav{display:none}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700}
.page-head p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Cards and grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card h2,.card h3{margin:0;font-size:16px;letter-spacing:-.005em;font-weight:700}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head .sub{color:var(--muted);font-size:13px;font-weight:500}
.grid{display:grid;gap:18px}
.dash{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);align-items:start}
.col{display:grid;gap:18px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.stack{display:grid;gap:10px}
.hr{height:1px;background:var(--line-2);margin:14px 0}

/* Dashboard hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.hero .day{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1}
.hero .date{font-size:18px;color:var(--ink-2);margin-top:8px;font-weight:500}
.hero .hi{color:var(--muted);margin-bottom:6px;font-weight:500}
.gpa-strip{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.gpa-strip > div{padding:12px 20px;border-left:1px solid var(--line-2);min-width:112px}
.gpa-strip > div:first-child{border-left:0}
.gpa-strip .k{font-size:12px;color:var(--muted);font-weight:500}
.gpa-strip .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.alerts{display:grid;gap:8px;margin-bottom:18px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;cursor:pointer;text-align:left;width:100%}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none}
.alert.danger{background:var(--danger-soft);border-color:transparent}
.alert.danger .dot{background:var(--danger)}
.alert.warn{background:var(--warn-soft);border-color:transparent}
.alert.warn .dot{background:var(--warn)}
.alert.info .dot{background:var(--accent)}

/* Items */
.list{display:grid}
.item{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .title{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:20px;height:20px;border:1.8px solid var(--muted);border-radius:6px;margin:2px 0 0;cursor:pointer;flex:none;display:grid;place-items:center;background:var(--surface)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.urgent{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.high{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.medium{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.low{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.overdue{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag{font-size:12px;color:var(--muted)}

.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.empty-big{padding:56px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--surface)}
.empty-big h3{margin:0 0 6px;font-size:18px}
.empty-big p{margin:0 auto 16px;color:var(--muted);max-width:46ch}

/* Mini schedule (dashboard) */
.agenda{display:grid;gap:2px}
.ag{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;align-items:start;cursor:pointer;border-radius:8px}
.ag .t{font-size:13px;color:var(--muted);font-weight:500;padding-top:1px}
.ag .b{border-left:3px solid var(--c,var(--accent));padding-left:10px}
.ag .b b{display:block;font-weight:600;line-height:1.3}
.ag.now .t{color:var(--ink);font-weight:700}
.ag.now .b{background:linear-gradient(90deg,var(--hl-soft),transparent 85%);border-radius:0 8px 8px 0}
.ag.past{opacity:.5}

/* Week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:12px;padding:8px 6px 10px;text-align:center;cursor:pointer;background:var(--surface);min-height:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wd:hover{border-color:var(--muted)}
.wd .n{font-size:12px;color:var(--muted);font-weight:600}
.wd .d{font-size:20px;font-weight:800;line-height:1}
.wd.today{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wd.today .n{color:inherit;opacity:.75}
.wd .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.wd .dots i{width:6px;height:6px;border-radius:50%;display:block}
.wd .cnt{font-size:11px;opacity:.75}

/* Grades list */
.glist .gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line-2);cursor:pointer}
.glist .gi:first-child{border-top:0}
.glist .gi .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.glist .gi .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist .gi .pc{font-weight:700;text-align:right}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;border-radius:99px}

/* Tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line)}
.tbl input,.tbl select{padding:5px 7px;font-size:13px}

/* Forms */
.field{display:grid;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.days-pick{display:flex;gap:5px;flex-wrap:wrap}
.days-pick label{position:relative}
.days-pick input{position:absolute;opacity:0;pointer-events:none}
.days-pick span{display:inline-grid;place-items:center;min-width:38px;height:32px;padding:0 6px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);background:var(--surface)}
.days-pick input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days-pick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.swatches input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
details.more{grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}
.switch input{width:17px;height:17px;accent-color:var(--accent)}

/* Toolbar / filters */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px}
.toolbar select{width:auto;flex:0 1 auto;padding:7px 10px;font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Time grid */
.tg{display:grid;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.tg-scroll{overflow-x:auto}
.tg-head{display:grid;border-bottom:1px solid var(--line)}
.tg-head > div{padding:10px 8px;text-align:center;border-left:1px solid var(--line-2);font-size:13px;color:var(--muted);font-weight:600;cursor:pointer}
.tg-head > div:first-child{border-left:0;cursor:default}
.tg-head .dn{display:block;font-size:20px;color:var(--ink);font-weight:800;line-height:1.1}
.tg-head .today .dn{display:inline-block;background:var(--hl);color:#16203A;border-radius:8px;padding:0 7px}
.tg-allday{display:grid;border-bottom:1px solid var(--line)}
.tg-allday > div{border-left:1px solid var(--line-2);padding:5px;display:flex;flex-direction:column;gap:3px;min-height:30px}
.tg-allday > div:first-child{border-left:0;font-size:11px;color:var(--muted);text-align:right;padding-right:8px;justify-content:center}
.tg-body{display:grid;position:relative}
.tg-hours{position:relative}
.tg-hours div{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.tg-col{position:relative;border-left:1px solid var(--line-2);cursor:copy}
.tg-col .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.blk{position:absolute;border-radius:8px;padding:4px 7px;font-size:12.5px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:3px solid var(--c);color:var(--ink);line-height:1.25;user-select:none}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tt{color:var(--ink-2);font-size:11.5px}
.blk.dragging{box-shadow:var(--shadow);z-index:5;opacity:.92}
.blk.rec{background-image:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--c) 7%,transparent) 8px 16px)}
.nowline{position:absolute;left:-1px;right:0;height:0;border-top:2px solid var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.pill{display:block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.pill.done{opacity:.55;text-decoration:line-through}

/* Week planner */
.wk{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wk-day{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:320px}
.wk-day.today{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--hl)}
.wk-day.over{background:var(--accent-soft)}
.wk-head{padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-2);cursor:pointer}
.wk-head b{font-size:15px}
.wk-head span{font-size:12px;color:var(--muted);display:block}
.wk-body{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.wk-sec{font-size:11px;color:var(--muted);font-weight:600;margin:6px 2px 1px}
.wk-it{font-size:12.5px;padding:5px 7px;border-radius:7px;background:var(--surface-2);border-left:3px solid var(--c,var(--line));cursor:pointer;line-height:1.3}
.wk-it[draggable=true]{cursor:grab}
.wk-it .tm{color:var(--muted);font-size:11.5px;display:block}
.wk-it.done{opacity:.55;text-decoration:line-through}
.wk-add{margin:auto 8px 8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
.wk-add:hover{border-color:var(--accent);color:var(--accent)}

/* Month */
.month{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.m-head,.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.m-head div{padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.m-cell{min-height:112px;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.m-cell:nth-child(7n+1){border-left:0}
.m-cell.out{background:var(--surface-2)}
.m-cell.out .mn{opacity:.45}
.m-cell .mn{font-size:13px;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:7px}
.m-cell.today .mn{background:var(--hl);color:#16203A}
.m-cell .more{font-size:11.5px;color:var(--muted);font-weight:600;padding-left:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.45}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

/* Upcoming */
.up-day{margin-bottom:20px}
.up-day h3{font-size:14px;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
.up-day h3 span{color:var(--muted);font-weight:500}

/* Course cards */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ccard:hover{border-color:var(--muted)}
.ccard .band{height:8px;background:var(--c)}
.ccard .in{padding:16px 18px;display:grid;gap:10px}
.ccard h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}
.ccard .big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.course-hero{border-radius:var(--r-lg);padding:22px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.course-hero h1{margin:0;font-size:28px;letter-spacing:-.02em}
.kv{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--ink-2);font-size:14px;margin-top:8px}
.kv b{color:var(--muted);font-weight:500}
.bigstat .v{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bigstat .k{font-size:13px;color:var(--muted)}

/* GPA */
.gpa-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.gpa-big .card .v{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:6px}
.gpa-big .card .k{font-size:14px;font-weight:600;color:var(--ink-2)}
.gpa-big .card .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.gpa-big .card.hl{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gpa-big .card.hl .k,.gpa-big .card.hl .s{color:inherit;opacity:.8}

/* What-if */
.wi-result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.wi-result .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gridl{stroke:var(--line-2)}
.legend-inline{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend-inline span{display:inline-flex;align-items:center;gap:5px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.42);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .14s ease}
.modal{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);animation:pop .16s ease}
.modal.wide{width:min(940px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h2{margin:0;font-size:18px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.detail-row{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:14px}
.detail-row:first-child{border-top:0}
.detail-row b{color:var(--muted);font-weight:500}

/* Row editor */
.re{display:grid;gap:8px}
.re-row{display:grid;grid-template-columns:auto 96px 96px minmax(0,1fr) 130px auto;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:6px}
.re-row input,.re-row select{padding:6px 8px;font-size:13.5px}
.re-row .mv{display:flex;flex-direction:column}
.re-row .mv button{height:16px;width:22px;padding:0}
.re-fixed{font-size:13px;color:var(--muted);padding:6px 10px;border-left:3px solid var(--line);margin-bottom:4px}
.re-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.re-tools select{width:auto;max-width:280px;padding:7px 10px;font-size:13.5px}
.re-rec{grid-template-columns:minmax(0,1.2fr) auto 92px 92px auto}

/* FAB */
.fab{position:fixed;right:26px;bottom:26px;width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--paper);border:0;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;z-index:40;transition:transform .15s}
.fab svg{width:24px;height:24px;transition:transform .15s}
.fab[aria-expanded="true"] svg{transform:rotate(45deg)}
.fab-menu{position:fixed;right:26px;bottom:92px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;display:grid;min-width:200px;animation:pop .14s ease}
.fab-menu button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.fab-menu button:hover{background:var(--surface-2)}
.fab-menu svg{width:17px;height:17px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;animation:pop .16s ease}
.toast button{background:none;border:0;color:var(--hl);font-weight:700;cursor:pointer}

.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}

/* Extracurriculars */
.ec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;border-left:5px solid var(--c)}
.ec h3{margin:0;font-size:17px}
.ec .sub2{color:var(--ink-2);font-size:14px}
.ec ul{margin:0;padding-left:18px;font-size:14px}

@media (max-width:1180px){ .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .dash > .col:last-child{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 14px 140px}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px;cursor:pointer}
  .bottom-nav button svg{width:21px;height:21px}
  .bottom-nav button[aria-current="page"]{color:var(--accent)}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));right:16px}
  .fab-menu{bottom:calc(144px + env(safe-area-inset-bottom,0px));right:16px}
  .dash,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .dash > .col:last-child{grid-template-columns:minmax(0,1fr)}
  .page-head h1{font-size:25px}
  .gpa-strip{width:100%} .gpa-strip > div{flex:1;min-width:0;padding:10px 12px} .gpa-strip .v{font-size:22px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .m-cell{min-height:74px;padding:3px} .m-cell .pill{font-size:10.5px;padding:1px 4px}
  .re-row{grid-template-columns:auto 1fr 1fr auto;}
  .re-row .re-title{grid-column:1/-1;order:-1}
  .re-row .re-cat{grid-column:2/4}
  .re-rec{grid-template-columns:1fr 1fr}
  .re-rec > *{grid-column:auto}
  .detail-row{grid-template-columns:100px 1fr}
  .modal{max-height:calc(100vh - 20px)}
  .modal-bg{padding:10px;align-items:end}
}
.sheet{position:fixed;inset:0;z-index:55;background:rgba(10,15,30,.42);display:flex;align-items:flex-end}
.sheet > div{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;animation:pop .15s ease}
.sheet button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;cursor:pointer}
.sheet button svg{width:22px;height:22px;color:var(--ink-2)}

.mp-sel{width:auto;padding:6px 10px;font-size:13px;font-weight:600;border-radius:9px;background:var(--surface)}
.mp-row{display:grid;grid-template-columns:minmax(64px,.8fr) minmax(0,1.3fr) minmax(0,1.3fr) 84px auto;gap:6px;align-items:center}
.mp-row input{padding:6px 8px;font-size:13.5px}
.side-foot .acct-slot{all:unset;display:block;width:100%;cursor:pointer;border-radius:10px}
.side-foot .acct-slot:focus-visible{outline:2px solid var(--accent)}
.acct{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;min-width:0}
.side-foot .acct:hover{background:var(--surface-2)}
.acct .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.acct.in .av{background:var(--ink);color:var(--paper)}
.acct > div{min-width:0}
.acct b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct small{display:block;font-size:12px;color:var(--muted)}
.acct.big .av{width:42px;height:42px;font-size:17px}
.acct.big b{font-size:15px}
.acct.big{padding:0}
@media (max-width:860px){ .mp-row{grid-template-columns:1fr 1fr;} .mp-row > input[data-mk=name]{grid-column:1/-1} }

</style>

<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand"><div class="brand-mark"><span>P</span></div><div><b>Planner</b><small id="brand-sub">Student planner</small></div></div>
    <nav id="side-nav"></nav>
    <div class="side-foot"><button class="acct-slot" data-nav="settings" aria-label="Account and sync settings"></button></div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<nav class="bottom-nav" aria-label="Main navigation">
  <button data-nav="dashboard" aria-label="Dashboard"></button>
  <button data-nav="homework" aria-label="Homework"></button>
  <button data-nav="schedule" aria-label="Schedule"></button>
  <button data-nav="grades" aria-label="Grades"></button>
  <button id="bottom-more" aria-label="More pages"></button>
</nav>
<button class="fab" id="fab" aria-label="Quick add" aria-expanded="false" aria-haspopup="menu"></button>
<script>
/* ========== Utilities ========== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const dow = iso => parseISO(iso).getDay();
const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDate = (iso, opt = { month: 'short', day: 'numeric' }) => iso ? parseISO(iso).toLocaleDateString(undefined, opt) : '';
const fmtDay = iso => fmtDate(iso, { weekday: 'short', month: 'short', day: 'numeric' });
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(clamp(m, 0, 1439) / 60))}:${pad(clamp(m, 0, 1439) % 60)}`;
const fmtTime = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtTimeShort = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const fmtMins = m => { m = num(m); if (!m) return ''; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const fmtPct = (v, d = 1) => v == null ? '–' : `${v.toFixed(d)}%`;
const fmtGPA = v => v == null ? '–' : v.toFixed(2);
const relDay = iso => { const n = diffDays(todayISO(), iso); if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday'; if (n > 1 && n < 7) return DAY_LONG[dow(iso)]; return fmtDay(iso); };
const weekStartOf = iso => { const ws = state.settings.weekStart; const d = dow(iso); return addDays(iso, -((d - ws + 7) % 7)); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* ========== Constants ========== */
const COURSE_TYPES = ['Regular', 'Honors', 'AP', 'IB', 'College/Dual Enrollment', 'Other'];
const PRIORITIES = ['Low', 'Medium', 'High', 'Urgent'];
const STATUSES = ['Not Started', 'In Progress', 'Completed', 'Late'];
const ASSIGN_CATS = ['Homework', 'Reading', 'Quiz', 'Test', 'Project', 'Essay', 'Lab', 'Classwork', 'Exam', 'Other'];
const GRADE_CATS = ['Homework', 'Quiz', 'Test', 'Project', 'Classwork', 'Lab', 'Exam', 'Other'];
const SCHED_CATS = ['Class', 'Homework', 'Studying', 'Practice', 'Meeting', 'Event', 'Free time', 'Custom'];
const EVENT_TYPES = ['Test', 'Quiz', 'Project', 'Event', 'Deadline', 'Other'];
const EC_CATS = ['Sport', 'Club', 'Arts', 'Music', 'Volunteering', 'Job', 'Academic', 'Competition', 'Leadership', 'Other'];
const COLORS = ['#2747C9', '#0E8F7E', '#C2410C', '#7C3AED', '#B91C5C', '#15803D', '#A16207', '#0369A1', '#4B5563', '#DC2626'];
const SCHED_COLORS = { 'Class': '#64748B', 'Homework': '#2747C9', 'Studying': '#7C3AED', 'Practice': '#0E8F7E', 'Meeting': '#A16207', 'Event': '#15803D', 'Free time': '#94A3B8', 'Custom': '#B91C5C' };
const CAL_CATS = { homework: { label: 'Homework', color: '#2747C9' }, test: { label: 'Tests & quizzes', color: '#DC2626' }, project: { label: 'Projects', color: '#7C3AED' }, event: { label: 'Events', color: '#15803D' }, deadline: { label: 'Deadlines', color: '#C2410C' }, class: { label: 'Classes', color: '#64748B' }, plan: { label: 'Planned time', color: '#0E8F7E' } };
const PRI_RANK = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
const DEFAULT_SCALE = [
  { l: 'A+', min: 97, p: 4.0 }, { l: 'A', min: 93, p: 4.0 }, { l: 'A-', min: 90, p: 3.7 }, { l: 'B+', min: 87, p: 3.3 },
  { l: 'B', min: 83, p: 3.0 }, { l: 'B-', min: 80, p: 2.7 }, { l: 'C+', min: 77, p: 2.3 }, { l: 'C', min: 73, p: 2.0 },
  { l: 'C-', min: 70, p: 1.7 }, { l: 'D+', min: 67, p: 1.3 }, { l: 'D', min: 65, p: 1.0 }, { l: 'F', min: 0, p: 0 }];
const DEFAULT_SETTINGS = {
  studentName: '', schoolName: '', theme: 'system', weekStart: 1, dayStart: '07:30', dayEnd: '15:00',
  defaultPriority: 'Medium', scale: DEFAULT_SCALE,
  weights: { 'Regular': 0, 'Honors': 0.5, 'AP': 1, 'IB': 1, 'College/Dual Enrollment': 1, 'Other': 0 },
  weightFailing: false, maxBase: 4.0, markingPeriods: [], finalMethod: 'mp'
};
const KEYS = ['settings', 'courses', 'assignments', 'grades', 'schedule', 'events', 'gpaHistory', 'activities'];
const LS_KEY = 'student-hq-v1';

/* ========== State ========== */
let state = blankState();
function blankState() {
  return { settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), courses: [], assignments: [], grades: [], schedule: [], events: [], gpaHistory: [], activities: [] };
}
function normalize(s) {
  const b = blankState();
  for (const k of KEYS) if (s && s[k] != null) b[k] = s[k];
  b.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings);
  b.settings.weights = Object.assign({}, DEFAULT_SETTINGS.weights, b.settings.weights || {});
  if (!Array.isArray(b.settings.scale) || !b.settings.scale.length) b.settings.scale = DEFAULT_SCALE;
  if (!Array.isArray(b.settings.markingPeriods)) b.settings.markingPeriods = [];
  for (const k of KEYS) if (k !== 'settings' && !Array.isArray(b[k])) b[k] = [];
  return b;
}
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
}
const lastSaved = {};
let DB = null, syncTimer = null;
const writing = {}, pendingWrite = {};
const ACCOUNT = { status: 'checking', name: '', lastSync: 0 };
const DIRTY_KEY = 'student-hq-dirty';
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { }
  if (DB) { clearTimeout(syncTimer); syncTimer = setTimeout(pushChanged, 600); }
  else { try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) { } }
}
function pushChanged(force) { let n = 0; for (const k of KEYS) { const s = JSON.stringify(state[k]); if (force || lastSaved[k] !== s) { writeKey(k, s); n++; } } if (!n) setSync('Synced', true); }
async function writeKey(k, s) {
  if (writing[k]) { pendingWrite[k] = true; return; }
  writing[k] = true; setSync('Saving…', true);
  try {
    await DB.db.doc(`data/users/${DB.id}/${k}`).set({ v: JSON.parse(s) }); lastSaved[k] = s; ACCOUNT.lastSync = Date.now();
    if (KEYS.every(x => lastSaved[x] === JSON.stringify(state[x]))) { try { localStorage.removeItem(DIRTY_KEY); } catch (e) { } }
    setSync('Synced', true);
  } catch (e) { setSync(e && e.code === 'quota_exceeded' ? 'Account storage full, saved on this device' : 'Couldn\'t sync, saved on this device', false); }
  writing[k] = false;
  if (pendingWrite[k]) { pendingWrite[k] = false; const cur = JSON.stringify(state[k]); if (cur !== lastSaved[k]) writeKey(k, cur); }
}
const SYNC = { text: 'Checking sign-in…', on: false };
function setSync(t, on) { SYNC.text = t; SYNC.on = on; renderAccount(); }
function hasData() { return KEYS.some(k => k !== 'settings' && state[k].length); }
function renderAccount() {
  const a = ACCOUNT; const initial = (a.name || state.settings.studentName || '?').trim().charAt(0).toUpperCase() || '?';
  const who = a.status === 'signed-in' ? (a.name ? `Signed in as ${a.name}` : 'Signed in') : a.status === 'checking' ? 'Checking sign-in…' : 'Not signed in';
  const line = a.status === 'signed-in' ? SYNC.text : a.status === 'checking' ? '' : 'Saved in this browser only';
  $$('.acct-slot').forEach(el => {
    el.innerHTML = `<div class="acct${a.status === 'signed-in' ? ' in' : ''}"><span class="av">${a.status === 'signed-in' ? '' : '!'}</span><div><b></b><small></small></div></div>`;
    const av = el.querySelector('.av'); if (a.status === 'signed-in') av.textContent = initial;
    el.querySelector('b').textContent = who; el.querySelector('small').textContent = line;
  });
  const sp = $('#acct-panel'); if (sp) sp.innerHTML = accountPanel();
}
function accountPanel() {
  const a = ACCOUNT;
  if (a.status === 'signed-in') return `<div class="acct big in"><span class="av">${esc((a.name || '?').charAt(0).toUpperCase())}</span><div><b>${esc(a.name || 'Your Claude account')}</b><small>${esc(SYNC.text)}${a.lastSync ? ' · last saved ' + new Date(a.lastSync).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''}</small></div></div>

}
function closeModal() { const m = modalStack.pop(); if (m) { m.remove(); m._prev?.focus?.(); } }

/* ========== Form builder ========== */
function opts(list, val, blank) {

}
const courseOpts = () => sortedCourses().map(c => [c.id, c.name]);
function fieldHTML(f, v) {
  const val = v ?? f.value ?? '';

  const lab = `<span>${esc(f.label)}${f.hint ? ` <em class="hint">${esc(f.hint)}</em>` : ''}</span>`;
  const req = f.required ? ' required' : '';
  switch (f.type) {
    case 'textarea': return `<label class="${cls}">${lab}<textarea name="${f.name}" rows="3" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea></label>`;
    case 'select': return `<label class="${cls}">${lab}<select name="${f.name}"${req}>${opts(f.options, val, f.blank)}</select></label>`;
    case 'days': { const ws = state.settings.weekStart; const arr = Array.isArray(val) ? val : []; const order = [0, 1, 2, 3, 4, 5, 6].map(i => (i + ws) % 7);
      return `<div class="${cls}">${lab}<div class="days-pick" data-days="${f.name}">${order.map(d => `<label><input type="checkbox" value="${d}"${arr.includes(d) ? ' checked' : ''}><span>${DAY_SHORT[d]}</span></label>`).join('')}</div></div>`; }
    case 'color': return `<div class="${cls}">${lab}<div class="swatches">${COLORS.map((c, i) => `<label><input type="radio" name="${f.name}" value="${c}"${(val || COLORS[0]) === c ? ' checked' : ''} aria-label="Color ${i + 1}"><span style="background:${c}"></span></label>`).join('')}</div></div>`;
    case 'check': return `<label class="switch ${f.full ? 'full' : ''}"><input type="checkbox" name="${f.name}"${val ? ' checked' : ''}> ${esc(f.label)}</label>`;
    default: return `<label class="${cls}">${lab}<input type="${f.type || 'text'}" name="${f.name}" value="${esc(val)}" placeholder="${esc(f.ph || '')}"${f.step ? ` step="${f.step}"` : ''}${f.min != null ? ` min="${f.min}"` : ''}${req}${f.autofocus ? ' autofocus' : ''}></label>`;
  }
}
function formHTML(fields, vals = {}) {
  const main = fields.filter(f => !f.adv), adv = fields.filter(f => f.adv);
  return `<form class="form-grid" novalidate>${main.map(f => fieldHTML(f, vals[f.name])).join('')}${adv.length ? `<details class="more"${vals._open ? ' open' : ''}><summary>More details</summary><div class="form-grid">${adv.map(f => fieldHTML(f, vals[f.name])).join('')}</div></details>` : ''}<button type="submit" hidden></button></form>`;
}
function readForm(form, fields) {
  const o = {};
  for (const f of fields) {
    if (f.type === 'days') { o[f.name] = $$(`[data-days="${f.name}"] input:checked`, form).map(i => +i.value).sort(); continue; }
    if (f.type === 'color') { o[f.name] = $(`input[name="${f.name}"]:checked`, form)?.value || COLORS[0]; continue; }
    const el = form.elements[f.name]; if (!el) continue;
    o[f.name] = f.type === 'check' ? el.checked : el.value.trim();
  }

}
function formModal({ title, fields, values = {}, submit = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extraFoot = '', validate }) {
  const m = openModal({ title, body: formHTML(fields, values), foot: `${onDelete ? `<button class="btn danger left" data-del>${esc(deleteLabel)}</button>` : ''}${extraFoot}<button class="btn" data-x>Cancel</button><button class="btn primary" data-save>${esc(submit)}</button>` });

    const data = readForm(form, fields);
    const missing = fields.find(f => f.required && !data[f.name]);
    if (missing) { const el = form.elements[missing.name]; el?.focus(); el?.setCustomValidity?.('Required'); el?.reportValidity?.(); setTimeout(() => el?.setCustomValidity?.(''), 1500); return; }
    const err = validate && validate(data); if (err) { toast(err); return; }
    if (onSubmit(data) !== false) closeModal();
  };
  form.addEventListener('submit', e => { e.preventDefault(); doSave(); });
  $('[data-save]', m).onclick = doSave; $('[data-x]', m).onclick = closeModal;
  if (onDelete) $('[data-del]', m).onclick = () => { closeModal(); onDelete(); };

}

/* ========== Homework ========== */
function viewHomework(q) {
  const f = ui.hwFilter; if (q.f === 'overdue') { f.due = 'overdue'; ui.hwTab = 'active'; history.replaceState(null, '', '#homework'); }
  const all = state.assignments; const t = todayISO(); const we = addDays(t, 7);
  let list = all.filter(a => ui.hwTab === 'done' ? isDone(a) : !isDone(a));
  if (f.course) list = list.filter(a => a.courseId === f.course);
  if (f.priority) list = list.filter(a => a.priority === f.priority);
  if (f.status) list = list.filter(a => a.status === f.status);
  if (f.category) list = list.filter(a => (a.category || 'Homework') === f.category);
  if (f.due === 'overdue') list = list.filter(isOverdue);
  if (f.due === 'today') list = list.filter(a => a.dueDate === t);
  if (f.due === 'tomorrow') list = list.filter(a => a.dueDate === addDays(t, 1));
  if (f.due === 'week') list = list.filter(a => a.dueDate && a.dueDate >= t && a.dueDate <= we);
  if (f.due === 'later') list = list.filter(a => a.dueDate && a.dueDate > we);
  if (f.due === 'none') list = list.filter(a => !a.dueDate);
  if (f.q) { const s = f.q.toLowerCase(); list = list.filter(a => [a.title, a.desc, courseName(a.courseId), ...(a.tags || [])].join(' ').toLowerCase().includes(s)); }
  const sorters = { due: (a, b) => dueStamp(a) - dueStamp(b) || PRI_RANK[a.priority] - PRI_RANK[b.priority], priority: (a, b) => PRI_RANK[a.priority] - PRI_RANK[b.priority] || dueStamp(a) - dueStamp(b), course: (a, b) => courseName(a.courseId).localeCompare(courseName(b.courseId)) || dueStamp(a) - dueStamp(b), recent: (a, b) => (b.created || 0) - (a.created || 0) };
  list.sort(ui.hwTab === 'done' && f.sort === 'due' ? (a, b) => (b.completedAt || 0) - (a.completedAt || 0) : sorters[f.sort]);
  const activeCount = all.filter(a => !isDone(a)).length, doneCount = all.length - activeCount;
  const anyFilter = f.course || f.priority || f.status || f.category || f.due || f.q;
  const totalMin = list.filter(a => !isDone(a)).reduce((s, a) => s + (num(a.estMin) || 0), 0);
  return `<div class="page-head"><div><h1>Homework</h1><p>${activeCount} to do${totalMin && ui.hwTab === 'active' ? ` · about ${fmtMins(totalMin)} of work in this view` : ''}</p></div><div class="actions"><button class="btn primary" data-act="addHw">${icon('plus')}Add homework</button></div></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${ui.hwTab === 'active'}" data-hwtab="active">To do <span class="muted">${activeCount}</span></button><button role="tab" aria-selected="${ui.hwTab === 'done'}" data-hwtab="done">Completed <span class="muted">${doneCount}</span></button></div>
  <div class="toolbar">
    <input type="search" id="hw-q" placeholder="Search assignments, notes, tags" value="${esc(f.q)}" aria-label="Search homework">
    <select data-hwf="course" aria-label="Filter by course">${opts(courseOpts(), f.course, 'All courses')}</select>
    <select data-hwf="due" aria-label="Filter by due date">${opts([['overdue', 'Overdue'], ['today', 'Due today'], ['tomorrow', 'Due tomorrow'], ['week', 'Next 7 days'], ['later', 'Later'], ['none', 'No due date']], f.due, 'Any due date')}</select>
    <select data-hwf="priority" aria-label="Filter by priority">${opts(PRIORITIES, f.priority, 'Any priority')}</select>
    <select data-hwf="status" aria-label="Filter by status">${opts(STATUSES, f.status, 'Any status')}</select>
    <select data-hwf="category" aria-label="Filter by type">${opts(ASSIGN_CATS, f.category, 'Any type')}</select>
    <select data-hwf="sort" aria-label="Sort">${opts([['due', ui.hwTab === 'done' ? 'Recently completed' : 'Due soonest'], ['priority', 'Priority'], ['course', 'Course'], ['recent', 'Recently added']], f.sort)}</select>
    ${anyFilter ? '<button class="btn sm ghost" id="hw-clear">Clear filters</button>' : ''}
  </div>
  <section class="card">${list.length ? `<div class="list">${list.map(a => assignRow(a, { relative: true })).join('')}</div>` :
    anyFilter ? '<div class="empty"><b>No matches</b>Try clearing a filter or searching for something else.</div>' :

}

/* ========== Upcoming ========== */
function viewUpcoming() {
  const t = todayISO(); const days = ui.upDays;
  const overdue = workOrder(state.assignments.filter(isOverdue));
  let out = '';
  if (overdue.length) out += `<div class="up-day"><h3 style="color:var(--danger)">Overdue <span>${overdue.length}</span></h3><section class="card" style="padding:8px 16px">${overdue.map(a => assignRow(a, { relative: false })).join('')}</section></div>`;
  let anything = false;
  for (let i = 0; i < days; i++) {
    const iso = addDays(t, i);
    const due = workOrder(dueOn(iso).filter(a => !isOverdue(a))); const ev = eventsOn(iso);
    const plans = schedFor(iso).filter(x => x.date && !['Class', 'Free time'].includes(x.category));
    if (!due.length && !ev.length && !plans.length) continue;
    anything = true;
    const label = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : DAY_LONG[dow(iso)];
    out += `<div class="up-day"><h3>${label} <span>${fmtDate(iso, { month: 'long', day: 'numeric' })}</span></h3><section class="card" style="padding:8px 16px"><div class="list">
      ${ev.map(e => `<div class="item"><span class="cdot" style="background:${CAL_CATS[eventCat(e)].color};margin-top:6px;border-radius:50%"></span><div class="body" data-open="e:${e.id}"><div class="title">${esc(e.title)}</div><div class="meta"><span>${esc(e.type)}</span>${e.courseId ? `<span>${esc(courseName(e.courseId))}</span>` : ''}${e.time ? `<span>${fmtTime(e.time)}</span>` : ''}</div></div>${['Test', 'Quiz', 'Project'].includes(e.type) ? '<span class="chip high">Assessment</span>' : ''}</div>`).join('')}
      ${due.map(a => assignRow(a, { due: !!a.dueTime })).join('')}
      ${plans.map(p => `<div class="item"><span class="cdot" style="background:${schedColor(p)};margin-top:6px"></span><div class="body" data-open="s:${p.id}:${iso}"><div class="title">${esc(p.title)}</div><div class="meta"><span>${fmtTime(p.start)} – ${fmtTime(p.end)}</span><span>${esc(p.category)}</span></div></div></div>`).join('')}
    </div></section></div>`;

/* ========== Time grid (shared by schedule and calendar) ========== */
const HP = 54; let dragEnded = 0;
function layoutCols(items) {
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  const clusters = []; let cur = [], curEnd = -1;
  for (const it of items) { if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; } cur.push(it); curEnd = Math.max(curEnd, it.e); }
  if (cur.length) clusters.push(cur);
  for (const cl of clusters) { const cols = []; for (const it of cl) { let i = cols.findIndex(end => end <= it.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = it.e; it.col = i; } cl.forEach(it => it.ncol = cols.length); }
  return items;
}
function gridItems(iso, hidden = {}) {
  const items = [];
  for (const s of schedFor(iso)) { const cat = s.category === 'Class' ? 'class' : 'plan'; if (hidden[cat]) continue; items.push({ s: toMin(s.start), e: Math.max(toMin(s.end), toMin(s.start) + 15), kind: 's', x: s, color: schedColor(s) }); }
  for (const e of eventsOn(iso)) { if (!e.time || hidden[eventCat(e)]) continue; const st = toMin(e.time); items.push({ s: st, e: Math.max(toMin(e.endTime) || st + 60, st + 15), kind: 'e', x: e, color: CAL_CATS[eventCat(e)].color }); }
  return layoutCols(items);
}

  return out.join('');
}
function timeGrid(dates, hidden = {}, opts = {}) {
  const per = dates.map(d => gridItems(d, hidden));
  const all = per.flat();
  const ds = toMin(state.settings.dayStart) ?? 450, de = toMin(state.settings.dayEnd) ?? 900;
  const h0 = Math.floor(Math.min(ds, ...all.map(i => i.s)) / 60), h1 = Math.min(24, Math.ceil(Math.max(de + 360, ...all.map(i => i.e)) / 60));
  const H = (h1 - h0) * HP; const t = todayISO(); const nm = nowMin();
  const cols = `56px repeat(${dates.length}, minmax(${dates.length > 1 ? 110 : 200}px, 1fr))`;
  const hours = Array.from({ length: h1 - h0 }, (_, i) => h0 + i);
  return `<div class="tg-scroll"><div class="tg" style="min-width:${dates.length > 1 ? 56 + 110 * dates.length : 0}px">
    <div class="tg-head" style="grid-template-columns:${cols}"><div></div>${dates.map(d => `<div class="${d === t ? 'today' : ''}" data-tgday="${d}" title="Open day view">${DAY_SHORT[dow(d)]} <span class="dn">${parseISO(d).getDate()}</span></div>`).join('')}</div>

    <div class="tg-body" style="grid-template-columns:${cols};height:${H}px">
      <div class="tg-hours">${hours.map((h, i) => i ? `<div style="top:${i * HP}px">${fmtTimeShort(fromMin(h * 60))}</div>` : '').join('')}</div>
      ${dates.map((d, di) => `<div class="tg-col" data-date="${d}" data-h0="${h0}" aria-label="${fmtDay(d)}">${hours.map((h, i) => `<div class="hl" style="top:${i * HP}px"></div>`).join('')}
        ${per[di].map(it => { const top = (it.s - h0 * 60) / 60 * HP, ht = Math.max(20, (it.e - it.s) / 60 * HP - 2); const w = 100 / it.ncol;
          const isS = it.kind === 's'; const drag = isS && it.x.date;
          return `<div class="blk${isS && !it.x.date ? ' rec' : ''}${drag ? ' drag' : ''}" style="--c:${it.color};top:${top}px;height:${ht}px;left:calc(${it.col * w}% + 2px);width:calc(${w}% - 4px)" data-open="${isS ? 's' : 'e'}:${it.x.id}:${d}" ${drag ? `data-sid="${it.x.id}"` : ''} title="${esc(it.x.title)}"><b>${esc(it.x.title)}</b>${ht > 34 ? `<span class="tt">${fmtTimeShort(isS ? it.x.start : it.x.time)}–${fmtTimeShort(isS ? it.x.end : fromMin(it.e))}</span>` : ''}</div>`; }).join('')}
        ${d === t && nm >= h0 * 60 && nm <= h1 * 60 ? `<div class="nowline" style="top:${(nm - h0 * 60) / 60 * HP}px"></div>` : ''}
      </div>`).join('')}
    </div></div></div>`;
}
function bindTimeGrid(root, onDay) {
  $$('.tg-col', root).forEach(col => col.addEventListener('click', e => {
    if (e.target !== col && !e.target.classList.contains('hl')) return;
    const r = col.getBoundingClientRect(); const m = Math.round(((e.clientY - r.top) / HP * 60 + (+col.dataset.h0) * 60) / 15) * 15;

  }));
  $$('[data-tgday]', root).forEach(h => h.onclick = () => onDay && onDay(h.dataset.tgday));

    const mv = ev => { const dy = ev.clientY - y0; if (!moved && Math.abs(dy) < 5) return; moved = true; b.classList.add('dragging'); delta = Math.round(dy / HP * 60 / 5) * 5; b.style.top = (top0 + delta / 60 * HP) + 'px'; };

/* ========== Charts ========== */

async function exportData() {
  const json = JSON.stringify({ app: 'student-planner', version: 1, exported: new Date().toISOString(), data: state }, null, 2);
  const filename = `planner-backup-${todayISO()}.json`;
  try {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl) { const r = await dl.save({ filename, data: json }); if (r?.status === 'saved') toast('Backup saved'); return; }
  } catch (e) { if (e && e.code !== 'unavailable') { if (e.code === 'cancelled' || e.code === 'declined') return; } }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importData(file) {

  r.onload = () => { try { const j = JSON.parse(r.result); const data = j.data || j; if (!KEYS.some(k => k in data)) throw 0;
      confirmBox(`Replace everything with this backup${j.exported ? ' from ' + new Date(j.exported).toLocaleDateString() : ''}? Your current data will be overwritten.`, 'Import backup', () => { state = normalize(data); applyTheme(); save(); render(); toast('Backup imported'); });
    } catch (e) { toast('That file isn\'t a planner backup'); } };
  r.readAsText(file);
}
function applyTheme() { const t = state.settings.theme; if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* ========== Render loop ========== */
let lastRouteKey = '';
function render() {
  const r = route(); shell(); const v = $('#view');
  let html = '', bind = null;
  switch (r.name) {
    case 'homework': html = viewHomework(r.q); bind = bindHomework; break;
    case 'upcoming': html = viewUpcoming(); bind = bindUpcoming; break;
    case 'schedule': html = viewSchedule(r.q); bind = bindSchedule; break;
    case 'calendar': html = viewCalendar(); bind = bindCalendar; break;
    case 'grades': html = viewGrades(); bind = bindGrades; break;
    case 'gpa': html = viewGPA(); bind = bindGPA; break;
    case 'courses': html = viewCourses(); break;
    case 'course': html = viewCourse(r.arg); bind = () => bindCourse(r.arg); break;
    case 'activities': html = viewActivities(); bind = bindActivities; break;
    case 'analytics': html = viewAnalytics(); break;
    case 'settings': html = viewSettings(); bind = bindSettings; break;
    default: html = viewDashboard();
  }
  v.innerHTML = `<div class="wrap">${html}</div>`;
  bind && bind();
  const key = r.name + (r.arg || '');
  if (key !== lastRouteKey) { window.scrollTo(0, 0); lastRouteKey = key; }
  const navName = NAV.find(n => n[0] === r.name)?.[1] || (r.name === 'course' ? courseName(r.arg) : 'Dashboard');
  document.title = `${navName} · Planner`;
}

/* ========== Marking period settings ========== */
const MP_PRESETS = { quarters: ['Q1', 'Q2', 'Q3', 'Q4'], semesters: ['Semester 1', 'Semester 2'], trimesters: ['T1', 'T2', 'T3'] };

    <div class="row between wrap-row" style="margin-top:10px"><button class="btn sm" data-mpadd>${icon('plus')}Add period</button>${fm === 'all' ? '' : `<span class="small" style="${Math.abs(tot - 100) < .01 ? 'color:var(--muted)' : 'color:var(--warn);font-weight:700'}">Weights total ${+tot.toFixed(2)}%${Math.abs(tot - 100) < .01 ? '' : ' (usually 100%)'}</span>`}</div>
    <label class="field" style="margin-top:14px"><span>Final grade is</span><select data-finalm>${opts([['mp', 'Weighted average of marking periods'], ['all', 'All grades together, ignoring periods']], fm)}</select></label>` :
    `<div class="empty" style="padding:12px"><b>None yet</b>Pick a preset above or add your own.<div><button class="btn sm" data-mpadd>${icon('plus')}Add period</button></div></div>`}
  </section>`;
}
function bindMpSettings() {
  const s = state.settings;
  $$('[data-mpi] [data-mk]').forEach(inp => inp.onchange = () => { const m = s.markingPeriods[+inp.closest('[data-mpi]').dataset.mpi]; const k = inp.dataset.mk; m[k] = k === 'weight' ? (num(inp.value) ?? 0) : inp.value.trim(); if (m.start && m.end && m.end < m.start) toast(`${m.name}: end date is before the start date`); save(); renderSoon(); });

  $$('[data-mpadd]').forEach(b => b.onclick = () => { const l = s.markingPeriods; const prev = l[l.length - 1]; l.push({ id: uid(), name: `Period ${l.length + 1}`, start: prev?.end ? addDays(prev.end, 1) : '', end: '', weight: 0 }); save(); renderSoon(); });

    if (s.markingPeriods.length) confirmBox('Replace your current marking periods with this preset? Report card grades entered for the old periods will no longer show.', 'Replace periods', apply); else apply(); };

(function init() {
  loadLocal(); applyTheme();
  const bn = { dashboard: ['home', 'Home'], homework: ['hw', 'Homework'], schedule: ['clock', 'Schedule'], grades: ['grade', 'Grades'] };
  $$('.bottom-nav [data-nav]').forEach(b => { const [i, l] = bn[b.dataset.nav]; b.innerHTML = icon(i) + l; });
  $('#bottom-more').innerHTML = icon('more') + 'More';
  $('#bottom-more').onclick = openSheet;
  $('#fab').innerHTML = icon('plus');
  $('#fab').onclick = () => toggleFab();
  window.addEventListener('hashchange', () => { closeSheet(); render(); });
  render(); renderAccount();
  initCloud();
  setInterval(() => { const r = route().name; if (!modalStack.length && !document.activeElement?.matches('input,select,textarea') && ['dashboard', 'schedule', 'calendar', ''].includes(r)) render(); }, 60000);
})();
</script>
</body>
</html>
